[package]
name = "gym-server"
description = "The backend: sign-in, the app API, health intake, the agent link (MCP) and Spotify."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gym-server"
path = "src/main.rs"

[dependencies]
gym-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip", "set-header", "timeout", "limit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "migrate", "derive", "macros"] }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "http2"] }
url = "2"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
rpassword = "7"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
time = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
