<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plate">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/app.css?v=__VERSION__">
</head>
<body>
<noscript><p class="noscript">This app needs JavaScript turned on.</p></noscript>
<div id="boot" class="boot" aria-hidden="true"><span class="boot-plate"></span></div>
<script type="module">
  import init from "/pkg/gym_web.js?v=__VERSION__";
  init({ module_or_path: "/pkg/gym_web_bg.wasm?v=__VERSION__" }).catch((e) => {
    console.error(e);
    const b = document.getElementById("boot");
    if (b) b.innerHTML = '<p class="boot-error">The app could not start. Close it and open it again.</p>';
  });
</script>
</body>
</html>
